name: MobileCLIP Android Tokenizer Parity

on:
  push:
    branches: [ main ]
    paths:
      - 'app/src/main/java/com/example/personalmemoryai/semantic/**'
      - 'app/src/test/**'
      - 'app/src/androidTest/**'
      - 'app/src/main/assets/models/semantic/**'
      - 'app/build.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/mobileclip_android_tokenizer_parity.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/src/main/java/com/example/personalmemoryai/semantic/**'
      - 'app/src/test/**'
      - 'app/src/androidTest/**'
      - 'app/src/main/assets/models/semantic/**'
      - 'app/build.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/mobileclip_android_tokenizer_parity.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  MOBILECLIP_TEXT_REVISION: '868dc14eb50de4a8347714b019aae242a0778675'
  MOBILECLIP_TEXT_SHA256: '92eba285a505df19f13126d373773714b4aae57863c7a6ba277d562ff7ad718'
  MOBILECLIP_TEXT_URL: 'https://huggingface.co/plainhub/mobileclip-s2-tflite/resolve/868dc14eb50de4a8347714b019aae242a0778675/mobileclip_s2_text.tflite?download=true'

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Download and verify pinned MobileCLIP-S2 Text TFLite
        run: |
          set -euo pipefail
          mkdir -p .ci/models
          curl --fail --location --retry 3 --retry-delay 2 \
            "$MOBILECLIP_TEXT_URL" \
            --output .ci/models/mobileclip_s2_text.tflite
          actual="$(sha256sum .ci/models/mobileclip_s2_text.tflite | awk '{print $1}')"
          test "$actual" = "$MOBILECLIP_TEXT_SHA256" \
            || { echo "SHA-256 mismatch: $actual"; exit 1; }
          echo "Verified revision: $MOBILECLIP_TEXT_REVISION"
          echo "Verified SHA-256: $actual"
          ls -lh .ci/models/mobileclip_s2_text.tflite

      - name: Run JVM tokenizer golden parity
        run: ./gradlew :app:testDebugUnitTest --tests com.example.personalmemoryai.semantic.OpenClipTokenizerGoldenJvmTest --stacktrace --no-daemon

      - name: Run real Text TFLite smoke inference
        run: ./gradlew :app:testDebugUnitTest --tests com.example.personalmemoryai.semantic.MobileClipTextTfliteSmokeJvmTest -Dmobileclip.text.model="$GITHUB_WORKSPACE/.ci/models/mobileclip_s2_text.tflite" --stacktrace --no-daemon

      - name: Print compact semantic test summary
        if: always()
        run: |
          echo "=== MobileCLIP semantic parity summary ==="
          if find app/build/test-results/testDebugUnitTest -type f -name 'TEST-*.xml' -print -quit | grep -q .; then
            grep -hE '<testsuite|<failure|<error' app/build/test-results/testDebugUnitTest/TEST-*.xml | head -40 || true
          else
            echo "No JUnit XML result was produced."
          fi

      - name: Upload JVM test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobileclip-android-tokenizer-parity-results
          path: |
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
