name: MobileCLIP Android Tokenizer Parity

on:
  push:
    branches: [ main ]
    paths:
      - 'app/src/main/java/com/example/personalmemoryai/semantic/OpenClipTokenizer.kt'
      - 'app/src/androidTest/**'
      - 'app/src/main/assets/models/semantic/**'
      - 'app/build.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/mobileclip_android_tokenizer_parity.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/src/main/java/com/example/personalmemoryai/semantic/OpenClipTokenizer.kt'
      - 'app/src/androidTest/**'
      - 'app/src/main/assets/models/semantic/**'
      - 'app/build.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/mobileclip_android_tokenizer_parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Create API 31 emulator
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-31" "system-images;android-31;google_apis;x86_64"
          echo "no" | avdmanager create avd --force --name mobileclip_api31 --package "system-images;android-31;google_apis;x86_64" --device "pixel_5"

      - name: Run Android tokenizer golden parity
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --tests com.example.personalmemoryai.semantic.OpenClipTokenizerGoldenTest --stacktrace

      - name: Upload Android test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobileclip-android-tokenizer-parity-results
          path: |
            app/build/outputs/androidTest-results/**
            app/build/reports/androidTests/**
          if-no-files-found: warn
