name: MobileCLIP Android Tokenizer Parity

on:
  push:
    branches: [ main ]
    paths:
      - 'app/src/main/java/com/example/personalmemoryai/semantic/OpenClipTokenizer.kt'
      - 'app/src/test/**'
      - 'app/src/androidTest/**'
      - 'app/src/main/assets/models/semantic/**'
      - 'app/build.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/mobileclip_android_tokenizer_parity.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/src/main/java/com/example/personalmemoryai/semantic/OpenClipTokenizer.kt'
      - 'app/src/test/**'
      - 'app/src/androidTest/**'
      - 'app/src/main/assets/models/semantic/**'
      - 'app/build.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/mobileclip_android_tokenizer_parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run JVM tokenizer golden parity
        run: ./gradlew :app:testDebugUnitTest --tests com.example.personalmemoryai.semantic.OpenClipTokenizerGoldenJvmTest --stacktrace --no-daemon

      - name: Print compact tokenizer test summary
        if: always()
        run: |
          echo "=== MobileCLIP tokenizer parity summary ==="
          if find app/build/test-results/testDebugUnitTest -type f -name 'TEST-*.xml' -print -quit | grep -q .; then
            grep -hE '<testsuite|<failure|<error' app/build/test-results/testDebugUnitTest/TEST-*.xml | head -20 || true
          else
            echo "No JUnit XML result was produced."
          fi

      - name: Upload JVM test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobileclip-android-tokenizer-parity-results
          path: |
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
