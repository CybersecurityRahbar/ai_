name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Repair malformed stageUri function
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/example/personalmemoryai/ui/BulkImagePickerActivity.kt')
          text = p.read_text()
          old_header = '    private fun stageUri(uri: Uri): File? = try {\n'
          new_header = '    private fun stageUri(uri: Uri): File? {\n        return try {\n'
          if old_header not in text:
              raise SystemExit('stageUri header not found; refusing to modify source')
          text = text.replace(old_header, new_header, 1)
          old_tail = '''    } catch (_: Throwable) {\n        null\n    }\n\n    private fun openBestEffortStream'''
          new_tail = '''        } catch (_: Throwable) {\n            null\n        }\n    }\n\n    private fun openBestEffortStream'''
          if old_tail not in text:
              raise SystemExit('stageUri tail not found; refusing to modify source')
          text = text.replace(old_tail, new_tail, 1)
          p.write_text(text)
          PY

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Commit source repair
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/personalmemoryai/ui/BulkImagePickerActivity.kt
          if git diff --cached --quiet; then
            echo "No source repair needed."
          else
            git commit -m "fix(picker): correct stageUri block body"
            git push
          fi

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: personal-memory-ai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
