name: MobileCLIP S2 binary audit

on:
  push:
    paths:
      - 'tools/mobileclip_audit.py'
      - '.github/workflows/mobileclip-s2-audit.yml'
      - 'docs/context/**'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install TFLite schema parser
        run: python -m pip install --upgrade pip && python -m pip install 'tflite==2.10.0'

      - name: Download MobileCLIP S2 TFLite bundle
        run: |
          set -euo pipefail
          mkdir -p .audit/mobileclip_s2
          curl --fail --location --retry 4 --retry-delay 2 --retry-all-errors \
            -o .audit/mobileclip_s2/mobileclip_s2_image.tflite \
            'https://huggingface.co/plainhub/mobileclip-s2-tflite/resolve/main/mobileclip_s2_image.tflite?download=true'
          curl --fail --location --retry 4 --retry-delay 2 --retry-all-errors \
            -o .audit/mobileclip_s2/mobileclip_s2_text.tflite \
            'https://huggingface.co/plainhub/mobileclip-s2-tflite/resolve/main/mobileclip_s2_text.tflite?download=true'
          curl --fail --location --retry 4 --retry-delay 2 --retry-all-errors \
            -o .audit/mobileclip_s2/tokenizer.json \
            'https://huggingface.co/plainhub/mobileclip-s2-tflite/resolve/main/tokenizer.json?download=true'
          sha256sum .audit/mobileclip_s2/*
          ls -lh .audit/mobileclip_s2

      - name: Audit tensors and tokenizer
        run: |
          set -euo pipefail
          python tools/mobileclip_audit.py \
            --image .audit/mobileclip_s2/mobileclip_s2_image.tflite \
            --text .audit/mobileclip_s2/mobileclip_s2_text.tflite \
            --tokenizer .audit/mobileclip_s2/tokenizer.json \
            --out .audit/mobileclip_s2/mobileclip_s2_contract.json

      - name: Upload MobileCLIP S2 audit bundle
        uses: actions/upload-artifact@v4
        with:
          name: mobileclip-s2-audit-bundle
          path: .audit/mobileclip_s2/
          if-no-files-found: error
          retention-days: 14
